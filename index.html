<!DOCTYPE html>
<html>
<head>
  <title>Daftar Produk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Header dengan ID -->
  <header id="header-halaman">
    <h1>Toko Online Kami</h1>
    <p>Temukan produk terbaik di sini</p>
  </header>
  
  <!-- Container produk dengan class -->
  <div class="container-produk">
    
    <!-- Produk 1: Produk Unggulan (dengan ID) -->
    <div class="kartu-produk produk-unggulan" id="produk-1">
      <div class="badge-unggulan">⭐ Produk Unggulan</div>
      <h2 class="nama-produk">Sepatu Running</h2>
      <p class="harga">Rp 500.000</p>
      <p class="deskripsi">
        Sepatu lari nyaman dengan bantalan empuk.
      </p>
      <button class="tombol-beli">Beli Sekarang</button>
    </div>
    
    <!-- Produk 2 -->
    <div class="kartu-produk" id="produk-2">
      <h2 class="nama-produk">Tas Ransel</h2>
      <p class="harga">Rp 250.000</p>
      <p class="deskripsi">
        Tas ransel tahan air untuk sehari-hari.
      </p>
      <button class="tombol-beli">Beli Sekarang</button>
    </div>
    
    <!-- Produk 3 -->
    <div class="kartu-produk" id="produk-3">
      <h2 class="nama-produk">Jam Tangan</h2>
      <p class="harga">Rp 350.000</p>
      <p class="deskripsi">
        Jam tangan stylish dengan garansi 1 tahun.
      </p>
      <button class="tombol-beli">Beli Sekarang</button>
    </div>
    
  </div>
  
  <!-- Footer -->
  <footer id="footer-halaman">
    <p>&copy; 2024 Toko Online Kami</p>
  </footer>
  
</body>
</html>
